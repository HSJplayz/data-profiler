name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest test_profiler -v
      - name: Smoke-test CLI
        run: |
          python cli.py --sample -o /tmp/smoke.html -q
          python cli.py --sample -f json -o /tmp/smoke.json -q
          test -s /tmp/smoke.html && test -s /tmp/smoke.json